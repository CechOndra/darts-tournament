<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power cards — demo</title>
<link rel="stylesheet" href="../src/power-card.css">
<link rel="stylesheet" href="../src/looks.css">
<style>
  body{margin:0;min-height:100vh;font-family:"Barlow Condensed",system-ui,sans-serif;color:#eaf3ff;background:radial-gradient(1200px 700px at 50% -10%,#16345f,#0a1630 50%,#05080f)}
  h1{font:400 40px "Bebas Neue",sans-serif;letter-spacing:.06em;text-align:center;margin:0;padding:20px 0 6px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 16px}
  button{font:700 17px "Barlow Condensed",system-ui;padding:9px 18px;border-radius:999px;border:1px solid rgba(128,160,220,.5);background:rgba(255,255,255,.1);color:inherit;cursor:pointer}
  button[hidden]{display:none} button.on{background:#eaf3ff;color:#071a3a}
  .track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px max(14vw,18px);scrollbar-width:none}
  .slot{flex:0 0 auto;scroll-snap-align:center}
  #msg{text-align:center;opacity:.8;margin:4px 16px;min-height:1em}
  .credit{text-align:center;opacity:.55;font-size:14px;padding:10px 0 24px}
</style></head>
<body>
<h1>POWER CARDS</h1>
<div class="row">
  <button id="look">Look: arcade</button>
  <button id="draw">Draw a card</button>
  <button id="gyro" hidden>Enable motion tilt</button>
</div>
<p id="msg"></p>
<div class="track" id="track"></div>
<div class="credit">Icons: <a style="color:inherit" href="https://game-icons.net">game-icons.net</a> (CC BY 3.0)</div>

<!-- GSAP is only needed for the reveal animation -->
<script src="./gsap.min.js"></script>
<script type="module">
import { renderCard, attachTilt, createGyro } from "../src/power-card.js";
import { playReveal } from "../src/reveal.js";

// look: "arcade" (final design, navy, dartboard back)  |  "classic" (the original, kept as a fallback)
let look = "arcade";
const OPTS = () => ({ look, tone: "navy", back: "board" });

const cards = await (await fetch("./cards.sample.json")).json();
const track = document.getElementById("track");
function draw() {
  track.replaceChildren();
  cards.forEach((c, i) => {
    const slot = document.createElement("div"); slot.className = "slot";
    const el = renderCard(c, { index: i, total: cards.length, ...OPTS() });
    el.onclick = () => playReveal(c, { index: i, total: cards.length, ...OPTS(), gsap });
    slot.append(el); track.append(slot);
  });
}
draw();
attachTilt();                                                   // mouse hover + finger drag (works on cards added later too)

const msg = document.getElementById("msg"), btn = document.getElementById("gyro");
const gyro = createGyro({
  onChange: (on) => { btn.classList.toggle("on", on); btn.textContent = on ? "Motion tilt: on" : "Enable motion tilt"; },
  onMessage: (t) => (msg.textContent = t),
});
btn.hidden = !gyro.supported;
btn.onclick = () => gyro.toggle();

document.getElementById("look").onclick = (e) => {
  look = look === "arcade" ? "classic" : "arcade"; e.target.textContent = "Look: " + look; draw();
};
document.getElementById("draw").onclick = () => {
  const i = Math.floor(Math.random() * cards.length);
  playReveal(cards[i], { index: i, total: cards.length, ...OPTS(), gsap });
};
</script>
</body></html>
